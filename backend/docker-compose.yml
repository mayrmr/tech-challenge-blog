version: "3.9"

services:
  app:
    build: .
    container_name: tech-challenge-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
    command: npm run dev
    env_file:
      - .env

  mongo:
    image: mongo:7
    container_name: tech-challenge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
